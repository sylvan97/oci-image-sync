name: Sync oci-help Image

on:
  workflow_dispatch:

permissions:
  packages: write
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Pull, Tag, and Push
        run: |
          SOURCE="gz1903/oci-help:latest"
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          TARGET="ghcr.io/${OWNER}/oci-help:latest"

          echo "Pulling $SOURCE..."
          docker pull $SOURCE

          echo "Tagging as $TARGET..."
          docker tag $SOURCE $TARGET

          echo "Pushing $TARGET..."
          docker push $TARGET
